<!--
  Kandoo's "Confirm signup" email. Supabase keeps its email templates in the
  dashboard, not in code: paste this into
  Authentication → Emails → Templates → Confirm signup (Message body, source view)
  and set the subject to: Confirm your email for Kandoo

  The logo is served by the backend (/brand), so it shows once that deploy is live.
  Styles are inline because most mail apps strip <style> blocks.
-->
<div style="margin:0;padding:32px 16px;background:#F7F0E6;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#2F241B;">
  <div style="max-width:440px;margin:0 auto;background:#FFFFFF;border:1px solid #E8D8C4;border-radius:20px;padding:40px 28px;text-align:center;">
    <img src="https://kandoo-toow.onrender.com/brand/kandoo-mark@2x.png" width="56" height="56" alt="Kandoo" style="display:block;margin:0 auto 24px;border:0;">
    <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:24px;line-height:1.3;margin:0 0 12px;color:#2F241B;">Confirm your email</h1>
    <p style="font-size:16px;line-height:1.5;color:#7A6758;margin:0 0 28px;">Tap below to confirm this address and finish setting up Kandoo.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#DA8F00;color:#2F241B;text-decoration:none;font-weight:600;font-size:16px;padding:14px 32px;border-radius:12px;">Confirm my email</a>
    <p style="font-size:13px;line-height:1.5;color:#B8A89C;margin:28px 0 0;">If you didn't sign up for Kandoo, you can ignore this email.</p>
  </div>
  <p style="text-align:center;font-size:13px;color:#7A6758;margin:20px 0 0;">Kandoo · Tell Kandoo once. It remembers when it matters.</p>
</div>
